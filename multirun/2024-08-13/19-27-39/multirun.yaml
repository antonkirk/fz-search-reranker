hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - sys=titan
    - model=mpnet_base
    - eval/dataset=findzebra,ada_dx
    - +experiment=eval_whoosh
  job:
    name: evaluate_model
    chdir: null
    override_dirname: +experiment=eval_whoosh,eval/dataset=findzebra,ada_dx,model=mpnet_base,sys=titan
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/s184191/fz-search-reranker
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/s184191/fz-search-reranker/fz_search_reranker/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: eval_whoosh
      eval: eval
      eval/dataset: findzebra
      training: training
      sys: titan
      prompts: llama3_instruct
      model: mpnet_base
      paths: paths
      dataset: llama3_openbiollm_synthetic
      data: data
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
data:
  load_from_disk: true
  save_to_disk: false
  chunk_size: 1000
  chunk_overlap: 100
  n_requests: 0
  clean_output: true
  seed: 42
  temperature: 0.6
dataset:
  name: llama3-openbiollm-synthetic
  path: ${paths.data_dir}/llama3-openbiollm-8b-dare-ties-70-40_synthetic_dataset.jsonl
  path_unprocessed: ${paths.data_dir}/unprocessed/llama3-openbiollm-8b-dare-ties-70-40_synthetic_dataset.jsonl
paths:
  data_dir: ${sys.base_dir}/data
  models_dir: ${sys.base_dir}/models
  index_dir: ${sys.base_dir}/index
  eval_dir: ${sys.base_dir}/eval
  dataset: ${dataset.path}
  dataset_unprocessed: ${dataset.path_unprocessed}
  requests: ${.data_dir}/api_requests.jsonl
  requests_results: ${.data_dir}/api_requests_results.jsonl
  chunks: ${.data_dir}/chunks.pkl
  example_queries: ${.data_dir}/example_queries.pkl
  model_output_dir: ${.model_dir}/${model.model_name}/
model:
  model_name: multi-qa-mpnet-base-dot-v1
  model_dir: ${.model_name}
  index_dir: ${paths.index_dir}/${.model_name}.faiss
prompts:
  system_prompt: 'You are a medical professional generating search queries based on
    a patient''s symptoms.

    You are given an example of a search query and a relevant chunk of text from a
    medical document.

    Generate exactly four different search queries of patient symptoms that is relevant
    to the input chunk.

    Each search query should include one or more relevant symptoms as keyword(s).
    Keywords should be comma-separated.

    Answer only with the queries.'
  user_prompt_template: 'Title: {chunk_title}

    Chunk: {chunk_content}

    User query: {user_query}'
sys:
  base_dir: /scratch/${oc.env:USER}
  cache_dir: ${.base_dir}/cache
  work_dir: ${.base_dir}/fz-openqa
  device: cuda
training:
  model_name: multi-qa-mpnet-base-dot-v1
  finetuned_name: retrieval-mpnet-dot-finetuned-${dataset.name}
  checkpoint_dir: ${paths.models_dir}/${.finetuned_name}/checkpoints/
  output_dir: ${paths.models_dir}/${.finetuned_name}/model/
  params:
    test_size: 0.2
    num_epochs: 15
    warmup_ratio: 0.1
    seed: 42
  wandb:
    project_name: fz-search-reranker
eval:
  dataset:
    name: findzebra
    path: findzebra/queries
  whoosh_index_dir: ${paths.index_dir}/whoosh
  use_whoosh: false
  use_faiss: false
  use_hybrid: false
  save_metrics: false
  ks:
  - 1
  - 3
  - 5
  - 10
  - 20
  - 50
  - 100
  - 200
  metrics_output_path: ${paths.eval_dir}/${model.model_name}_${.dataset.name}_eval.csv
override /eval.metrics_output_path: ${paths.eval_dir}/${eval.dataset}_whoosh_eval.csv
override /eval.use_whoosh: true
override /eval.use_faiss: false
override /eval.use_hybrid: false
override /eval.save_metrics: true
